<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RC遥控车赛道</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      font-family: "Space Grotesk", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      background-color: #111111;
      overflow-x: hidden;
    }

    /* ── Hero 区域 ── */
    .hero {
      position: relative;
      width: 100%;
      height: 100vh;
      min-height: 560px;
      overflow: hidden;
    }

    /* 背景图 */
    .hero__bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    /* 暗色遮罩，确保文字可读 */
    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.38);
    }

    /* ── 导航栏包裹层（浮于 hero 顶部） ── */
    .navbar-wrapper {
      position: absolute;
      top: 20px;
      left: 0;
      right: 0;
      z-index: 100;
      padding: 0 20px;
      max-width: 560px;
      margin: 0 auto;
    }

    /* 红色小圆点指示器 */
    .navbar-wrapper::after {
      content: "";
      display: block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #e8002d;
      margin-top: 6px;
      margin-left: 4px;
    }

    /* ── 顶部导航栏主体 ── */
    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: #ffffff;
      border: 2px solid #111111;
      border-radius: 20px;
      padding: 0 20px;
      height: 52px;
    }

    /* ── Logo ── */
    .navbar__brand {
      text-decoration: none;
      color: #111111;
      font-family: "Space Grotesk", Arial, sans-serif;
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -1px;
      line-height: 1;
      flex-shrink: 0;
    }

    /* ── 导航链接列表 ── */
    .navbar__nav {
      display: flex;
      align-items: center;
      gap: 4px;
      list-style: none;
    }

    .navbar__nav a {
      display: block;
      padding: 6px 16px;
      color: #111111;
      text-decoration: none;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 10px;
      transition: background 0.15s;
    }

    .navbar__nav a:hover {
      background-color: #f0f0f0;
    }

    /* ── 汉堡菜单按钮 ── */
    .navbar__toggle {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 6px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px;
      flex-shrink: 0;
    }

    .navbar__toggle span {
      display: block;
      width: 26px;
      height: 2.5px;
      background-color: #111111;
      border-radius: 2px;
    }

    /* ── 下拉菜单 ── */
    .navbar__dropdown {
      display: none;
      flex-direction: column;
      background-color: #ffffff;
      border: 2px solid #111111;
      border-radius: 16px;
      margin-top: 8px;
      overflow: hidden;
    }

    .navbar__dropdown.open {
      display: flex;
    }

    .navbar__dropdown a {
      padding: 14px 24px;
      color: #111111;
      text-decoration: none;
      font-size: 1rem;
      font-weight: 700;
      border-bottom: 1px solid #eeeeee;
      transition: background 0.15s;
    }

    .navbar__dropdown a:last-child {
      border-bottom: none;
    }

    .navbar__dropdown a:hover {
      background-color: #f5f5f5;
    }

    /* ── Hero 标题文字（左下角） ── */
    .hero__headline {
      position: absolute;
      bottom: 60px;
      left: 52px;
      z-index: 10;
      color: #ffffff;
      font-size: clamp(3rem, 7vw, 6rem);
      font-weight: 800;
      line-height: 1.08;
      letter-spacing: -2px;
    }

    .hero__headline span {
      display: block;
    }

    /* ── 底部红点滚动指示器（右下角） ── */
    .hero__scroll-dot {
      position: absolute;
      bottom: 52px;
      right: 52px;
      z-index: 10;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background-color: #e8002d;
    }
  </style>
</head>
<body>

  <section class="hero">
    <!-- 背景图：RC遥控车赛道 -->
    <img
      class="hero__bg"
      src="https://github.com/user-attachments/assets/d5ecf10a-6a8a-4f09-8d6c-2daf80354f22"
      alt="RC遥控车赛道·随心拼装"
    />

    <!-- 顶部导航栏 -->
    <div class="navbar-wrapper">
      <nav class="navbar" role="navigation" aria-label="Main navigation">
        <a href="#" class="navbar__brand">waabi</a>

        <ul class="navbar__nav">
          <li><a href="#">Home</a></li>
        </ul>

        <button class="navbar__toggle" id="menuToggle" aria-label="Open menu" aria-expanded="false" aria-controls="dropdown">
          <span></span>
          <span></span>
        </button>
      </nav>

      <div class="navbar__dropdown" id="dropdown" role="menu">
        <a href="#" role="menuitem">Events</a>
        <a href="#" role="menuitem">Leaderboard</a>
        <a href="#" role="menuitem">About Us</a>
      </div>
    </div>

    <!-- Hero 标题 -->
    <h1 class="hero__headline">
      <span>RC遥控车赛道·</span>
      <span>随心拼装。</span>
    </h1>

    <!-- 红点滚动指示器 -->
    <div class="hero__scroll-dot" aria-hidden="true"></div>
  </section>

  <script>
    const toggle = document.getElementById('menuToggle');
    const dropdown = document.getElementById('dropdown');

    toggle.addEventListener('click', () => {
      const isOpen = dropdown.classList.toggle('open');
      toggle.setAttribute('aria-expanded', isOpen);
      toggle.setAttribute('aria-label', isOpen ? 'Close menu' : 'Open menu');
    });
  </script>

</body>
</html>
