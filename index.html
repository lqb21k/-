<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RC遥控车赛道</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;800&family=Noto+Sans+SC:wght@700;900&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      /* 全页滚动容器，强制整页吸附 */
      height: 100%;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scroll-behavior: smooth;
    }

    body {
      font-family: "Space Grotesk", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      background-color: #111111;
      overflow-x: hidden;
    }

    /* ────────────────────────────────────────
       固定导航栏（悬浮于所有 slide 之上）
    ──────────────────────────────────────── */
    .navbar-wrapper {
      position: fixed;
      top: 20px;
      left: 0;
      right: 0;
      z-index: 1000;
      padding: 0 20px;
      max-width: 560px;
      margin: 0 auto;
      pointer-events: none; /* 让背后的 slide 可响应鼠标滚轮 */
    }

    .navbar-wrapper > * {
      pointer-events: auto;
    }

    /* 红色小圆点 */
    .navbar-wrapper::after {
      content: "";
      display: block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #e8002d;
      margin-top: 6px;
      margin-left: 4px;
      pointer-events: none;
    }

    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: #ffffff;
      border: 2px solid #111111;
      border-radius: 20px;
      padding: 0 20px;
      height: 52px;
    }

    .navbar__brand {
      text-decoration: none;
      color: #111111;
      font-family: "Space Grotesk", Arial, sans-serif;
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -1px;
      line-height: 1;
      flex-shrink: 0;
    }

    .navbar__nav {
      display: flex;
      align-items: center;
      gap: 4px;
      list-style: none;
    }

    .navbar__nav a {
      display: block;
      padding: 6px 16px;
      color: #111111;
      text-decoration: none;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 10px;
      transition: background 0.15s;
    }

    .navbar__nav a:hover {
      background-color: #f0f0f0;
    }

    .navbar__toggle {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 6px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px;
      flex-shrink: 0;
    }

    .navbar__toggle span {
      display: block;
      width: 26px;
      height: 2.5px;
      background-color: #111111;
      border-radius: 2px;
    }

    .navbar__dropdown {
      display: none;
      flex-direction: column;
      background-color: #ffffff;
      border: 2px solid #111111;
      border-radius: 16px;
      margin-top: 8px;
      overflow: hidden;
    }

    .navbar__dropdown.open {
      display: flex;
    }

    .navbar__dropdown a {
      padding: 14px 24px;
      color: #111111;
      text-decoration: none;
      font-size: 1rem;
      font-weight: 700;
      border-bottom: 1px solid #eeeeee;
      transition: background 0.15s;
    }

    .navbar__dropdown a:last-child {
      border-bottom: none;
    }

    .navbar__dropdown a:hover {
      background-color: #f5f5f5;
    }

    /* ────────────────────────────────────────
       公共 slide 样式
    ──────────────────────────────────────── */
    .slide {
      position: relative;
      width: 100%;
      height: 100vh;
      min-height: 560px;
      overflow: hidden;
      /* 每个 slide 整页吸附 */
      scroll-snap-align: start;
    }

    .slide__bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    /* 暗色遮罩 */
    .slide::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.42);
      pointer-events: none;
    }

    /* ────────────────────────────────────────
       Slide 1：RC 赛道
    ──────────────────────────────────────── */
    .slide-1__headline {
      position: absolute;
      bottom: 60px;
      left: 52px;
      z-index: 10;
      color: #ffffff;
      font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: clamp(3rem, 7vw, 6rem);
      font-weight: 900;
      line-height: 1.08;
      letter-spacing: -1px;
    }

    .slide-1__headline span {
      display: block;
    }

    /* 红点（右下角，提示可向下滚动） */
    .slide-1__scroll-dot {
      position: absolute;
      bottom: 52px;
      right: 52px;
      z-index: 10;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background-color: #e8002d;
      animation: bounce 1.8s ease-in-out infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-8px); }
    }

    /* ────────────────────────────────────────
       Slide 2：Built to think. Born to haul.
    ──────────────────────────────────────── */
    .slide-2 {
      background-color: #0d0d0d;
    }

    /* 大标题（左上方，与参考图一致） */
    .slide-2__headline {
      position: absolute;
      top: 120px;
      left: 52px;
      right: 52px;
      z-index: 10;
      color: #ffffff;
      font-size: clamp(3.5rem, 8.5vw, 7.5rem);
      font-weight: 800;
      line-height: 1.04;
      letter-spacing: -3px;
    }

    .slide-2__headline span {
      display: block;
    }

    /* 副标题（左下角） */
    .slide-2__subtitle {
      position: absolute;
      bottom: 60px;
      left: 52px;
      z-index: 10;
      color: #ffffff;
      font-size: clamp(1rem, 1.6vw, 1.25rem);
      font-weight: 700;
      line-height: 1.5;
      max-width: 380px;
    }
  </style>
</head>
<body>

  <!-- ── 固定导航栏（跨 slide 持久显示） ── -->
  <div class="navbar-wrapper">
    <nav class="navbar" role="navigation" aria-label="Main navigation">
      <a href="#" class="navbar__brand">waabi</a>

      <ul class="navbar__nav">
        <li><a href="#">Home</a></li>
      </ul>

      <button class="navbar__toggle" id="menuToggle" aria-label="Open menu" aria-expanded="false" aria-controls="dropdown">
        <span></span>
        <span></span>
      </button>
    </nav>

    <div class="navbar__dropdown" id="dropdown" role="menu">
      <a href="#" role="menuitem">Events</a>
      <a href="#" role="menuitem">Leaderboard</a>
      <a href="#" role="menuitem">About Us</a>
    </div>
  </div>

  <!-- ── Slide 1：RC 遥控车赛道 ── -->
  <section class="slide slide-1" id="slide-1">
    <img
      class="slide__bg"
      src="https://github.com/user-attachments/assets/d5ecf10a-6a8a-4f09-8d6c-2daf80354f22"
      alt="RC遥控车赛道·随心拼装"
    />

    <h1 class="slide-1__headline">
      <span>RC遥控车赛道·</span>
      <span>随心拼装。</span>
    </h1>

    <div class="slide-1__scroll-dot" aria-hidden="true"></div>
  </section>

  <!-- ── Slide 2：Built to think. Born to haul. ── -->
  <section class="slide slide-2" id="slide-2">
    <h2 class="slide-2__headline">
      <span>Built to think.</span>
      <span>Born to haul.</span>
    </h2>

    <p class="slide-2__subtitle">
      Waabi is pioneering the<br />future of Physical AI.
    </p>
  </section>

  <script>
    const toggle = document.getElementById('menuToggle');
    const dropdown = document.getElementById('dropdown');

    toggle.addEventListener('click', () => {
      const isOpen = dropdown.classList.toggle('open');
      toggle.setAttribute('aria-expanded', isOpen);
      toggle.setAttribute('aria-label', isOpen ? 'Close menu' : 'Open menu');
    });
  </script>

</body>
</html>
