<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Top Navigation Bar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Space Grotesk", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      background-color: #ffffff;
      padding: 16px;
    }

    /* ── 顶部导航栏包裹层（带红点指示器） ── */
    .navbar-wrapper {
      position: sticky;
      top: 16px;
      z-index: 1000;
      max-width: 520px;
      margin: 0 auto;
    }

    /* 红色小圆点指示器 */
    .navbar-wrapper::after {
      content: "";
      display: block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #e8002d;
      margin-top: 6px;
      margin-left: 4px;
    }

    /* ── 顶部导航栏主体 ── */
    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: #ffffff;
      border: 2px solid #111111;
      border-radius: 20px;
      padding: 0 20px;
      height: 52px;
    }

    /* ── Logo ── */
    .navbar__brand {
      text-decoration: none;
      color: #111111;
      font-family: "Space Grotesk", Arial, sans-serif;
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -1px;
      line-height: 1;
      flex-shrink: 0;
    }

    /* ── 导航链接列表 ── */
    .navbar__nav {
      display: flex;
      align-items: center;
      gap: 4px;
      list-style: none;
    }

    .navbar__nav a {
      display: block;
      padding: 6px 16px;
      color: #111111;
      text-decoration: none;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 10px;
      transition: background 0.15s;
    }

    .navbar__nav a:hover {
      background-color: #f0f0f0;
    }

    /* ── 汉堡菜单按钮（两横线 = 样式） ── */
    .navbar__toggle {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 6px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px;
      flex-shrink: 0;
    }

    .navbar__toggle span {
      display: block;
      width: 26px;
      height: 2.5px;
      background-color: #111111;
      border-radius: 2px;
    }

    /* ── 下拉菜单（展开后） ── */
    .navbar__dropdown {
      display: none;
      flex-direction: column;
      background-color: #ffffff;
      border: 2px solid #111111;
      border-radius: 16px;
      margin-top: 8px;
      overflow: hidden;
    }

    .navbar__dropdown.open {
      display: flex;
    }

    .navbar__dropdown a {
      padding: 14px 24px;
      color: #111111;
      text-decoration: none;
      font-size: 1rem;
      font-weight: 700;
      border-bottom: 1px solid #eeeeee;
      transition: background 0.15s;
    }

    .navbar__dropdown a:last-child {
      border-bottom: none;
    }

    .navbar__dropdown a:hover {
      background-color: #f5f5f5;
    }
  </style>
</head>
<body>

  <div class="navbar-wrapper">
    <!-- 顶部导航栏 -->
    <nav class="navbar" role="navigation" aria-label="Main navigation">
      <!-- 品牌 Logo -->
      <a href="#" class="navbar__brand">waabi</a>

      <!-- 中部导航链接 -->
      <ul class="navbar__nav">
        <li><a href="#">Home</a></li>
      </ul>

      <!-- 汉堡按钮（两条横线） -->
      <button class="navbar__toggle" id="menuToggle" aria-label="Open menu" aria-expanded="false" aria-controls="dropdown">
        <span></span>
        <span></span>
      </button>
    </nav>

    <!-- 展开式下拉菜单 -->
    <div class="navbar__dropdown" id="dropdown" role="menu">
      <a href="#" role="menuitem">Events</a>
      <a href="#" role="menuitem">Leaderboard</a>
      <a href="#" role="menuitem">About Us</a>
    </div>
  </div>

  <script>
    const toggle = document.getElementById('menuToggle');
    const dropdown = document.getElementById('dropdown');

    toggle.addEventListener('click', () => {
      const isOpen = dropdown.classList.toggle('open');
      toggle.setAttribute('aria-expanded', isOpen);
      toggle.setAttribute('aria-label', isOpen ? 'Close menu' : 'Open menu');
    });
  </script>

</body>
</html>
